<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aura Tarot | Rider-Waite Tarot</title><link rel="stylesheet" href="tarot.css"><link rel="stylesheet" href="language.css"><link rel="stylesheet" href="flip.css"><link rel="stylesheet" href="black-gold.css"><link rel="stylesheet" href="card-ratio.css"></head>
<body class="tarot"><main class="tarot-shell">
  <nav class="tarot-nav"><a class="tarot-brand" href="index.html"><i>*</i> Aura Tarot</a><div class="tarot-links"><a href="meanings.html" data-t="library">Card meanings</a><button class="language-button" id="langToggle" type="button" aria-label="Switch language">&#20013;&#25991;</button></div></nav>
  <section class="hero"><span class="eyebrow" data-t="deck">Rider-Waite-Smith tarot</span><h1 data-t-html="headline">Draw what seeks<br>your attention.</h1><p data-t="subhead">Choose a classic spread, set an intention, and let the cards speak.</p></section>
  <div class="spread-picker" id="spreadPicker"></div><div class="spread-title"><h2 id="spreadName"></h2><p id="spreadDescription"></p></div><section class="deck-stage" id="deckStage" aria-label="Tarot card deck"><button class="mystic-card" id="mysticCard" type="button" aria-label="Draw a Tarot card"><span class="card-back"><b>*</b></span><span class="card-front"><b>+</b></span></button></section><section class="reading-table" id="readingTable" aria-live="polite"></section><div class="card-detail" id="cardDetail"></div><p style="text-align:center"><button class="draw-button" id="drawButton" type="button"></button></p>
</main><script src="cards.js"></script><script>
const ui={en:{library:'Card meanings',deck:'Rider-Waite-Smith tarot',headline:'Draw what seeks<br>your attention.',subhead:'Choose a classic spread, set an intention, and let the cards speak.',ready:'Set your intention, then draw the cards.',draw:'Draw the cards',again:'Draw again',reveal:'Select a card to reveal its interpretation.',up:'Upright',rev:'Reversed'},zh:{library:'\u724c\u4e49\u5927\u5168',deck:'\u83b1\u5fb7-\u4f1f\u7279-\u53f2\u5bc6\u65af\u5854\u7f57',headline:'\u62bd\u51fa\u6b64\u523b<br>\u6700\u9700\u8981\u6ce8\u610f\u7684\u4fe1\u606f\u3002',subhead:'\u9009\u62e9\u4e00\u79cd\u7ecf\u5178\u724c\u9635\uff0c\u9ed8\u5ff5\u95ee\u9898\uff0c\u7136\u540e\u8ba9\u724c\u9762\u56de\u5e94\u4f60\u3002',ready:'\u5148\u9759\u5fc3\u4e13\u6ce8\uff0c\u518d\u62bd\u51fa\u724c\u9762\u3002',draw:'\u5f00\u59cb\u62bd\u724c',again:'\u91cd\u65b0\u62bd\u724c',reveal:'\u70b9\u51fb\u4e00\u5f20\u724c\u67e5\u770b\u5b83\u7684\u89e3\u8bfb\u3002',up:'\u6b63\u4f4d',rev:'\u9006\u4f4d'}};
const spreads=[{name:'Single card',zhName:'\u5355\u5f20\u724c',description:'A clear message for the present moment.',zhDescription:'\u4e3a\u5f53\u4e0b\u5448\u73b0\u4e00\u6761\u6e05\u6670\u7684\u4fe1\u606f\u3002',positions:['Present focus'],zhPositions:['\u5f53\u4e0b\u91cd\u70b9']},{name:'Past / Present / Future',zhName:'\u8fc7\u53bb / \u73b0\u5728 / \u672a\u6765',description:'Trace the movement of your current story.',zhDescription:'\u770b\u770b\u4f60\u7684\u6545\u4e8b\u6b63\u5982\u4f55\u5c55\u5f00\u3002',positions:['Past','Present','Future'],zhPositions:['\u8fc7\u53bb','\u73b0\u5728','\u672a\u6765']},{name:'Situation / Action / Outcome',zhName:'\u60c5\u5883 / \u884c\u52a8 / \u7ed3\u679c',description:'Find your footing and the direction ahead.',zhDescription:'\u627e\u5230\u5f53\u4e0b\u7684\u7acb\u8db3\u70b9\u4e0e\u524d\u884c\u65b9\u5411\u3002',positions:['Situation','Helpful action','Potential outcome'],zhPositions:['\u60c5\u5883','\u6709\u76ca\u884c\u52a8','\u6f5c\u5728\u7ed3\u679c']},{name:'Five-card cross',zhName:'\u4e94\u5f20\u5341\u5b57\u724c\u9635',description:'A concise look at the forces shaping your question.',zhDescription:'\u7b80\u6d01\u4e86\u89e3\u6b63\u5728\u5f71\u54cd\u95ee\u9898\u7684\u529b\u91cf\u3002',positions:['The heart of it','What crosses you','Foundation','What is possible','Near future'],zhPositions:['\u6838\u5fc3','\u963b\u788d','\u57fa\u7840','\u53ef\u80fd\u6027','\u8fd1\u671f\u672a\u6765']},{name:'Celtic cross',zhName:'\u51ef\u5c14\u7279\u5341\u5b57',description:'A ten-card map for deeper exploration.',zhDescription:'\u7528\u5341\u5f20\u724c\u6df1\u5165\u63a2\u7d22\u95ee\u9898\u3002',positions:['Present','Challenge','Foundation','Recent past','Possible outcome','Near future','Your stance','Environment','Hopes & fears','Outcome'],zhPositions:['\u73b0\u51b5','\u6311\u6218','\u57fa\u7840','\u8fd1\u671f\u8fc7\u53bb','\u53ef\u80fd\u7ed3\u679c','\u8fd1\u671f\u672a\u6765','\u4f60\u7684\u72b6\u6001','\u73af\u5883','\u5e0c\u671b\u4e0e\u6050\u60e7','\u7ed3\u679c']}];
let current=0,language=localStorage.getItem('tarot-language')||'en',isDrawing=false;const picker=document.getElementById('spreadPicker'),table=document.getElementById('readingTable'),detail=document.getElementById('cardDetail'),deckStage=document.getElementById('deckStage'),mysticCard=document.getElementById('mysticCard');
function t(k){return ui[language][k]}function cardName(c){return language==='zh'?c.zhName:c.name}function renderPicker(){picker.querySelectorAll('button').forEach((b,i)=>b.textContent=language==='zh'?spreads[i].zhName:spreads[i].name)}function applyLanguage(){document.documentElement.lang=language==='zh'?'zh-CN':'en';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-t-html]').forEach(e=>e.innerHTML=t(e.dataset.tHtml));document.getElementById('langToggle').textContent=language==='zh'?'EN':'\u4e2d\u6587';renderPicker();choose(current)}
function buildBacks(){const s=spreads[current],eye='<svg class="horus-eye" viewBox="0 0 120 70" aria-hidden="true"><path d="M8 34 C32 8 83 8 112 34 C83 60 32 60 8 34 Z"/><circle cx="60" cy="34" r="13"/><path d="M51 48 C48 59 39 65 29 66 M70 48 C76 57 84 60 94 58"/></svg>';table.innerHTML='';s.positions.forEach((position,i)=>{const pos=language==='zh'?s.zhPositions[i]:position;const el=document.createElement('article');el.className='draw-card card-slot';el.style.setProperty('--i',i);el.innerHTML=`<button class="flip-card" type="button" aria-label="${pos}"><span class="flip-side flip-back">${eye}</span><span class="flip-side flip-front"></span></button><p class="position">${pos}</p><h3 class="card-label"></h3><p class="orientation"></p>`;el.querySelector('.flip-card').addEventListener('click',draw);table.append(el)})}
function choose(i){current=i;picker.querySelectorAll('button').forEach((b,n)=>b.classList.toggle('active',n===i));const s=spreads[i];document.getElementById('spreadName').textContent=language==='zh'?s.zhName:s.name;document.getElementById('spreadDescription').textContent=language==='zh'?s.zhDescription:s.description;deckStage.hidden=true;deckStage.classList.remove('flipping');buildBacks();detail.textContent=t('ready');document.getElementById('drawButton').textContent=t('draw')}
spreads.forEach((s,i)=>{const b=document.createElement('button');b.addEventListener('click',()=>choose(i));picker.append(b)});
function draw(){if(isDrawing)return;if(table.querySelector('.flip-card.is-flipped')){buildBacks();requestAnimationFrame(draw);return}isDrawing=true;const pool=[...TAROT_CARDS].sort(()=>Math.random()-.5);[...table.querySelectorAll('.card-slot')].forEach((el,i)=>{const c=pool[i],reversed=Math.random()<.34,flip=el.querySelector('.flip-card'),front=el.querySelector('.flip-front');front.innerHTML=`<img src="${c.image}" alt="${cardName(c)} Rider-Waite card">`;el.querySelector('.card-label').textContent=cardName(c);el.querySelector('.orientation').textContent=reversed?t('rev'):t('up');if(reversed)el.classList.add('reversed');flip.addEventListener('click',()=>{detail.innerHTML=`<strong>${cardName(c)} | ${reversed?t('rev'):t('up')}</strong><br>${reversed?c.reversed:c.upright}`});setTimeout(()=>{flip.classList.add('is-flipped');el.classList.add('revealed')},i*130)});document.getElementById('drawButton').textContent=t('again');detail.textContent=t('reveal');setTimeout(()=>isDrawing=false,Math.max(700,table.children.length*130+520))}
document.getElementById('drawButton').addEventListener('click',draw);mysticCard.addEventListener('click',draw);document.getElementById('langToggle').addEventListener('click',()=>{language=language==='zh'?'en':'zh';localStorage.setItem('tarot-language',language);applyLanguage()});applyLanguage();
</script></body></html>
