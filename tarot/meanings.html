<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Card meanings | Aura Tarot</title><link rel="stylesheet" href="tarot.css"><link rel="stylesheet" href="language.css"><link rel="stylesheet" href="black-gold.css"><link rel="stylesheet" href="card-ratio.css"></head>
<body class="tarot"><main class="tarot-shell">
  <nav class="tarot-nav"><a class="tarot-brand" href="index.html"><i>*</i> Aura Tarot</a><div class="tarot-links"><a href="index.html" id="drawLink">Draw cards</a><button class="language-button" id="langToggle" type="button">&#20013;&#25991;</button></div></nav>
  <header class="library-head"><span class="eyebrow" id="deckLabel">The complete 78-card deck</span><h1 id="pageTitle">Card meanings</h1><p id="pageIntro">Explore traditional Rider-Waite-Smith symbolism in either orientation.</p></header>
  <div class="library-tools"><input id="search" type="search" placeholder="Search cards or arcana" aria-label="Search card meanings"></div><section class="library" id="library"></section>
</main>
<dialog class="meaning-dialog" id="dialog"><button class="close-dialog" type="button" aria-label="Close">x</button><div class="dialog-grid"><img id="dialogImage" alt=""><div><span class="eyebrow" id="dialogArcana"></span><h2 id="dialogName"></h2><h3 id="uprightLabel">Upright</h3><p id="dialogUpright"></p><h3 id="reversedLabel">Reversed</h3><p id="dialogReversed"></p></div></div></dialog>
<script src="cards.js"></script><script>
const library=document.getElementById('library'),dialog=document.getElementById('dialog');let language=localStorage.getItem('tarot-language')||'en';
const copy={en:{draw:'Draw cards',deck:'The complete 78-card deck',title:'Card meanings',intro:'Explore traditional Rider-Waite-Smith symbolism in either orientation.',search:'Search cards or arcana',up:'Upright',rev:'Reversed'},zh:{draw:'\u62bd\u724c',deck:'\u5b8c\u6574\u7684 78 \u5f20\u724c',title:'\u724c\u4e49\u5927\u5168',intro:'\u63a2\u7d22\u83b1\u5fb7-\u4f1f\u7279-\u53f2\u5bc6\u65af\u5854\u7f57\u7684\u6b63\u4f4d\u4e0e\u9006\u4f4d\u542b\u4e49\u3002',search:'\u641c\u7d22\u724c\u540d\u6216\u724c\u7ec4',up:'\u6b63\u4f4d',rev:'\u9006\u4f4d'}};
function cName(c){return language==='zh'?c.zhName:c.name}function cMeaning(c,key){return language==='zh'?c[key+'Zh']:c[key]}
function show(list){library.innerHTML='';list.forEach(c=>{const el=document.createElement('article');el.className='meaning-card';el.innerHTML=`<img src="${c.image}" alt="${cName(c)} Rider-Waite card" loading="lazy"><small>${c.arcana}</small><h2>${cName(c)}</h2>`;el.addEventListener('click',()=>{dialogImage.src=c.image;dialogImage.alt=cName(c)+' Rider-Waite card';dialogArcana.textContent=c.arcana;dialogName.textContent=cName(c);dialogUpright.textContent=cMeaning(c,'upright');dialogReversed.textContent=cMeaning(c,'reversed');uprightLabel.textContent=copy[language].up;reversedLabel.textContent=copy[language].rev;dialog.showModal()});library.append(el)})}
function applyLanguage(){const x=copy[language];document.documentElement.lang=language==='zh'?'zh-CN':'en';drawLink.textContent=x.draw;deckLabel.textContent=x.deck;pageTitle.textContent=x.title;pageIntro.textContent=x.intro;search.placeholder=x.search;langToggle.textContent=language==='zh'?'EN':'\u4e2d\u6587';uprightLabel.textContent=x.up;reversedLabel.textContent=x.rev;show(TAROT_CARDS)}
search.addEventListener('input',e=>{const q=e.target.value.toLowerCase();show(TAROT_CARDS.filter(c=>(c.name+c.zhName+c.arcana+c.upright+c.reversed).toLowerCase().includes(q)))});langToggle.addEventListener('click',()=>{language=language==='zh'?'en':'zh';localStorage.setItem('tarot-language',language);applyLanguage()});document.querySelector('.close-dialog').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});applyLanguage();
</script></body></html>
